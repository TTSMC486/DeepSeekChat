name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        id: build
        run: |
          set -o pipefail
          mkdir -p ci-logs
          gradle -p android assembleDebug --no-daemon --stacktrace 2>&1 | tee ci-logs/build.log

      - name: Publish build log
        if: always()
        continue-on-error: true
        run: |
          mkdir -p ci-logs
          tail -c 150000 ci-logs/build.log > ci-logs/build.tail.log 2>/dev/null || true
          { echo "build outcome: ${{ steps.build.outcome }}"
            echo "----- java -----";  java -version 2>&1
            echo "----- gradle -----"; gradle --version 2>&1 | head -15
          } > ci-logs/diag.txt 2>&1
          cp -f android/app/build/outputs/apk/debug/app-debug.apk ci-logs/DeepSeekChat-debug.apk 2>/dev/null || true
          sha256sum ci-logs/DeepSeekChat-debug.apk >> ci-logs/diag.txt 2>/dev/null || true
          git config user.name  ci-bot
          git config user.email ci@localhost
          git checkout -B ci-log
          git add -f ci-logs/
          git commit -m "ci log" || true
          git push -f origin ci-log

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeekChat-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
