name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # [skip ci] 提交只用来补文件，不触发构建
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure stable debug keystore
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            echo "keystore 不存在，生成一把并提交回 main"
            keytool -genkeypair -v \
              -keystore android/app/debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            git config user.name  ci-bot
            git config user.email ci@localhost
            git add -f android/app/debug.keystore
            git commit -m "ci: 生成固定签名用的 debug.keystore [skip ci]"
            git push origin HEAD:main || echo "推送失败（可能已被别的运行抢先），本仓库仍用本地这把"
          else
            echo "keystore 已存在，继续使用"
          fi

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        id: build
        run: |
          set -o pipefail
          mkdir -p ci-logs
          gradle -p android assembleDebug --no-daemon --stacktrace 2>&1 | tee ci-logs/build.log

      - name: Publish build log
        if: always()
        continue-on-error: true
        run: |
          mkdir -p ci-logs
          tail -c 150000 ci-logs/build.log > ci-logs/build.tail.log 2>/dev/null || true
          { echo "build outcome: ${{ steps.build.outcome }}"
            echo "----- java -----";  java -version 2>&1
            echo "----- gradle -----"; gradle --version 2>&1 | head -15
          } > ci-logs/diag.txt 2>&1
          cp -f android/app/build/outputs/apk/debug/app-debug.apk ci-logs/DeepSeekChat-debug.apk 2>/dev/null || true
          sha256sum ci-logs/DeepSeekChat-debug.apk >> ci-logs/diag.txt 2>/dev/null || true
          git config user.name  ci-bot
          git config user.email ci@localhost
          git checkout -B ci-log
          git add -f ci-logs/
          git commit -m "ci log" || true
          git push -f origin ci-log

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeekChat-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
