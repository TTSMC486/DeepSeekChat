<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0f1115">
<meta name="color-scheme" content="dark light">
<title>DeepSeek Chat</title>
<style>
:root{
  --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --border:#272c38;
  --fg:#e7eaf1; --muted:#8b93a7; --accent:#4d6bfe; --accent2:#7b93ff;
  --user:#2a3350; --code:#12151c; --danger:#ff5f6d;
  --radius:14px; --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
html[data-theme="light"]{
  --bg:#f5f6fa; --panel:#ffffff; --panel2:#eef0f6; --border:#dfe3ec;
  --fg:#151922; --muted:#666e80; --user:#e2e8ff; --code:#f0f2f7;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg);color:var(--fg);
  font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
textarea,input,select{font:inherit;color:var(--fg);background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;outline:none;width:100%}
textarea:focus,input:focus,select:focus{border-color:var(--accent)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.topbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;
  padding:calc(var(--safe-t) + 8px) 10px 8px;background:var(--panel);border-bottom:1px solid var(--border);z-index:20}
.topbar .icobtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:19px;flex:0 0 auto}
.topbar .icobtn:active{background:var(--panel2)}
.topbar .title{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-weight:600;justify-content:center}
.model-chip{font-size:11px;font-weight:500;color:var(--accent2);background:rgba(77,107,254,.14);
  border:1px solid rgba(77,107,254,.3);border-radius:999px;padding:1px 8px;white-space:nowrap}
.title-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44vw}
#drawer{position:fixed;top:0;left:0;bottom:0;width:80vw;max-width:320px;background:var(--panel);
  border-right:1px solid var(--border);z-index:60;transform:translateX(-102%);transition:transform .22s ease;
  display:flex;flex-direction:column;padding-top:var(--safe-t);padding-bottom:var(--safe-b)}
#drawer.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.5)}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55;opacity:0;pointer-events:none;transition:opacity .22s}
#scrim.show{opacity:1;pointer-events:auto}
.drawer-head{padding:14px 14px 10px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px}
.drawer-head .logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:14px;color:#fff}
.sesslist{flex:1;overflow-y:auto;padding:4px 8px}
.sess{display:flex;align-items:center;gap:8px;padding:10px;border-radius:10px;margin-bottom:2px}
.sess:active,.sess.active{background:var(--panel2)}
.sess.active{box-shadow:inset 2px 0 0 var(--accent)}
.sess .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.sess .d{opacity:0;font-size:15px;padding:2px 6px;border-radius:6px;color:var(--muted)}
.sess:active .d,.sess.active .d{opacity:1}
.drawer-foot{border-top:1px solid var(--border);padding:10px 12px calc(10px + var(--safe-b));display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--border);background:var(--panel2);border-radius:10px;padding:8px 12px;font-size:13px}
.btn:active{background:var(--border)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--danger);border-color:rgba(255,95,109,.35)}
main{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:14px 12px 4px}
.empty{max-width:520px;margin:8vh auto 0;text-align:center;color:var(--muted)}
.empty h2{font-size:22px;color:var(--fg);margin:0 0 6px}
.empty .logo{width:60px;height:60px;margin:0 auto 14px;border-radius:18px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:28px;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:22px}
.chip{border:1px solid var(--border);background:var(--panel);border-radius:12px;padding:9px 13px;font-size:13px;color:var(--fg);max-width:100%}
.chip:active{border-color:var(--accent)}
.msg{display:flex;gap:9px;margin-bottom:16px;align-items:flex-start}
.avatar{flex:0 0 30px;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:13px;font-weight:700;user-select:none}
.msg.user{flex-direction:row-reverse}
.msg.user .avatar{background:var(--user);color:var(--fg)}
.msg.assistant .avatar{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.bubble{max-width:min(86%,720px);min-width:0}
.msg.user .bubble{background:var(--user);border-radius:var(--radius) var(--radius) 4px var(--radius);padding:9px 13px}
.msg.assistant .bubble{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius) var(--radius) var(--radius) 4px;padding:11px 13px}
.msg .body{word-wrap:break-word;overflow-wrap:anywhere}
.msg .body>*:first-child{margin-top:0}
.msg .body>*:last-child{margin-bottom:0}
.msg .body p{margin:.5em 0}
.msg .body h1,.msg .body h2,.msg .body h3,.msg .body h4{margin:.9em 0 .45em;line-height:1.35}
.msg .body h1{font-size:1.32em}.msg .body h2{font-size:1.2em}.msg .body h3{font-size:1.08em}
.msg .body ul,.msg .body ol{margin:.45em 0;padding-left:1.4em}
.msg .body li{margin:.18em 0}
.msg .body blockquote{margin:.5em 0;padding:.35em .9em;border-left:3px solid var(--accent);color:var(--muted);background:var(--panel2);border-radius:0 8px 8px 0}
.msg .body a{color:var(--accent2)}
.msg .body hr{border:0;border-top:1px solid var(--border);margin:1em 0}
.msg .body code.ic{background:var(--code);padding:1px 5px;border-radius:5px;font-size:.9em;font-family:ui-monospace,Menlo,Consolas,monospace}
.msg .body table{border-collapse:collapse;width:100%;margin:.6em 0;font-size:.94em;display:block;overflow-x:auto}
.msg .body th,.msg .body td{border:1px solid var(--border);padding:6px 9px;text-align:left}
.msg .body th{background:var(--panel2);font-weight:600}
.codeblk{margin:.6em 0;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--code)}
.codehead{display:flex;align-items:center;justify-content:space-between;padding:5px 10px;background:var(--panel2);border-bottom:1px solid var(--border);font-size:11.5px;color:var(--muted);font-family:ui-monospace,monospace}
.codehead button{font-size:11.5px;padding:2px 8px;border-radius:6px;border:1px solid var(--border);color:var(--muted)}
.codeblk pre{margin:0;padding:11px;overflow-x:auto}
.codeblk code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.8px;line-height:1.55;white-space:pre}
details.reason{margin:0 0 9px;border:1px dashed var(--border);border-radius:9px;background:var(--panel2);overflow:hidden}
details.reason>summary{cursor:pointer;padding:7px 11px;font-size:12.5px;color:var(--muted);list-style:none;display:flex;align-items:center;gap:6px}
details.reason>summary::-webkit-details-marker{display:none}
details.reason>summary::before{content:"\25B8";transition:transform .15s}
details.reason[open]>summary::before{transform:rotate(90deg)}
details.reason .rbody{padding:0 11px 10px;font-size:13px;color:var(--muted);white-space:pre-wrap;max-height:44vh;overflow-y:auto}
.actions{display:flex;gap:6px;margin-top:8px;opacity:0;transition:opacity .15s}
.msg:hover .actions,.msg.show-actions .actions{opacity:1}
.actions button{font-size:12px;color:var(--muted);border:1px solid var(--border);border-radius:8px;padding:3px 8px}
.typing{display:inline-flex;gap:4px;padding:3px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:bl 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes bl{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.err{color:var(--danger);font-size:13.5px;white-space:pre-wrap}
.composer{flex:0 0 auto;padding:8px 10px calc(8px + var(--safe-b));background:var(--panel);border-top:1px solid var(--border);
  display:flex;gap:8px;align-items:flex-end;z-index:15}
.composer textarea{resize:none;max-height:34vh;min-height:42px;line-height:1.5;border-radius:12px;background:var(--panel2);padding:11px 12px}
.sendbtn{flex:0 0 42px;width:42px;height:42px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:17px}
.sendbtn.stop{background:var(--danger)}
.modal{position:fixed;inset:0;z-index:80;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55)}
.modal.open{display:flex}
.sheet{background:var(--panel);width:100%;max-width:560px;border-radius:18px 18px 0 0;border:1px solid var(--border);
  max-height:92vh;overflow-y:auto;padding:16px 16px calc(20px + var(--safe-b))}
.sheet h3{margin:0 0 14px;font-size:17px;display:flex;align-items:center;justify-content:space-between}
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
.field .hint{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.small{font-size:12px;padding:8px 10px}
.foot{display:flex;gap:9px;margin-top:16px}
.foot .btn{flex:1;text-align:center;padding:11px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0}
.switch input{flex:0 0 auto;width:20px;height:20px;accent-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(76px + var(--safe-b));transform:translateX(-50%);
  background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:9px 15px;font-size:13px;
  z-index:99;opacity:0;pointer-events:none;transition:opacity .2s;max-width:86vw;text-align:center}
.toast.show{opacity:1}
.badge{font-size:11px;color:var(--muted);text-align:center;padding:8px 0 0;line-height:1.5}
</style>
</head>
<body>

<header class="topbar">
  <button class="icobtn" id="btnMenu" aria-label="菜单">&#9776;</button>
  <div class="title"><span class="title-text" id="titleText">DeepSeek</span><span class="model-chip" id="modelChip">deepseek-chat</span></div>
  <button class="icobtn" id="btnNew" aria-label="新对话">&#43;</button>
</header>

<aside id="drawer">
  <div class="drawer-head"><span class="logo">DS</span><span>DeepSeek Chat</span></div>
  <div class="sesslist" id="sessList"></div>
  <div class="drawer-foot">
    <button class="btn" id="btnSettings">&#9881; 设置</button>
    <button class="btn" id="btnExport">导出</button>
    <button class="btn" id="btnImport">导入</button>
    <button class="btn danger" id="btnClear">清空</button>
  </div>
</aside>
<div id="scrim"></div>

<main id="msgs"></main>

<footer class="composer">
  <textarea id="input" rows="1" placeholder="给 DeepSeek 发消息…" enterkeyhint="send"></textarea>
  <button class="sendbtn" id="btnSend" aria-label="发送">&#10148;</button>
</footer>

<div class="modal" id="settingsModal">
  <div class="sheet">
    <h3>设置 <button class="btn small" id="btnCloseSettings">关闭</button></h3>
    <div class="field">
      <label>API Key</label>
      <input type="password" id="fApiKey" placeholder="sk-..." autocomplete="off" spellcheck="false">
      <div class="hint">在 platform.deepseek.com &#8594; API keys 创建。仅保存在本机，不会上传到任何第三方。</div>
    </div>
    <div class="field">
      <label>接口地址 (Base URL)</label>
      <input type="text" id="fBaseUrl" placeholder="https://api.deepseek.com" spellcheck="false">
    </div>
    <div class="row">
      <div class="field">
        <label>模型</label>
        <select id="fModel">
          <option value="deepseek-chat">deepseek-chat（快，通用）</option>
          <option value="deepseek-reasoner">deepseek-reasoner（深度推理）</option>
        </select>
      </div>
      <div class="field">
        <label>温度 <span id="fTempVal">1.0</span></label>
        <input type="range" id="fTemp" min="0" max="2" step="0.1" style="padding:0;border:0;background:none">
      </div>
    </div>
    <div class="field">
      <label>最大回复长度 (max_tokens)</label>
      <input type="number" id="fMaxTokens" min="256" max="65536" step="256">
    </div>
    <div class="field">
      <label>系统提示词 (System Prompt)</label>
      <textarea id="fSystem" rows="3" placeholder="你是一个乐于助人的中文 AI 助手。"></textarea>
    </div>
    <div class="switch"><span>流式输出（打字机效果）</span><input type="checkbox" id="fStream"></div>
    <div class="switch"><span>深色主题</span><input type="checkbox" id="fDark"></div>
    <div class="switch"><span>显示思考过程（reasoner）</span><input type="checkbox" id="fShowReason"></div>
    <div class="foot">
      <button class="btn" id="btnTest">测试连接</button>
      <button class="btn primary" id="btnSaveSettings">保存</button>
    </div>
    <div class="badge" id="envBadge"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="fileImport" accept="application/json,.json" style="display:none">

<script>
"use strict";
/* =========================================================================
 * DeepSeek Chat — 单文件客户端
 * 传输层双通道：Android 壳 (window.DeepSeekBridge) 优先，否则浏览器 fetch+SSE
 * ========================================================================= */

const $  = (s, r) => (r || document).querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function copy(text) {
  const done = () => toast('已复制');
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done).catch(fallback);
  } else fallback();
  function fallback() {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { toast('复制失败'); }
    ta.remove();
  }
}

/* ===================== 1. Markdown 渲染（零依赖） ===================== */
const CodeStore = [];
function renderMarkdown(src) {
  const blocks = [];
  let text = String(src || '').replace(/```([^\n`]*)\n?([\s\S]*?)(?:```|$)/g, (m, lang, code) => {
    blocks.push({ lang: (lang || '').trim(), code: code.replace(/\n+$/, '') });
    return '\n\u0000B' + (blocks.length - 1) + '\u0000\n';
  });

  const inline = t => esc(t)
    .replace(/`([^`\n]+)`/g, '<code class="ic">$1</code>')
    .replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>')
    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*\w])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/~~([^~\n]+)~~/g, '<del>$1</del>')
    .replace(/\[([^\]\n]*)\]\(([^)\s]+)\)/g, function (m, txt, url) {
      return /^(https?:|mailto:|#|\/)/i.test(url)
        ? '<a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + txt + '</a>' : m;
    });

  const isSep = s => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(s);
  const cells = s => s.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(x => x.trim());
  const lines = text.split('\n');
  const out = [];
  let i = 0;

  while (i < lines.length) {
    const line = lines[i];

    const bm = line.match(/^\u0000B(\d+)\u0000$/);
    if (bm) {
      const b = blocks[+bm[1]];
      const id = CodeStore.push(b.code) - 1;
      out.push('<div class="codeblk"><div class="codehead"><span>' + esc(b.lang || 'code') + '</span>' +
        '<button class="copybtn" data-src="' + id + '">复制</button></div>' +
        '<pre><code>' + esc(b.code) + '</code></pre></div>');
      i++; continue;
    }
    if (!line.trim()) { i++; continue; }
    if (/^\s*([-*_])\s*(?:\1\s*){2,}$/.test(line)) { out.push('<hr>'); i++; continue; }

    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) { const n = h[1].length; out.push('<h' + n + '>' + inline(h[2]) + '</h' + n + '>'); i++; continue; }

    if (line.indexOf('|') >= 0 && i + 1 < lines.length && isSep(lines[i + 1])) {
      const head = cells(line); i += 2; const rows = [];
      while (i < lines.length && lines[i].indexOf('|') >= 0 && lines[i].trim()) { rows.push(cells(lines[i])); i++; }
      let t = '<table><thead><tr>' + head.map(c => '<th>' + inline(c) + '</th>').join('') + '</tr></thead><tbody>';
      for (const r of rows) t += '<tr>' + r.map(c => '<td>' + inline(c) + '</td>').join('') + '</tr>';
      out.push(t + '</tbody></table>'); continue;
    }

    if (/^\s*>/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) { buf.push(lines[i].replace(/^\s*>\s?/, '')); i++; }
      out.push('<blockquote>' + inline(buf.join('\n')).replace(/\n/g, '<br>') + '</blockquote>'); continue;
    }
    if (/^\s*[-*+]\s+/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) { buf.push(lines[i].replace(/^\s*[-*+]\s+/, '')); i++; }
      out.push('<ul>' + buf.map(x => '<li>' + inline(x) + '</li>').join('') + '</ul>'); continue;
    }
    if (/^\s*\d+[.)]\s+/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) { buf.push(lines[i].replace(/^\s*\d+[.)]\s+/, '')); i++; }
      out.push('<ol>' + buf.map(x => '<li>' + inline(x) + '</li>').join('') + '</ol>'); continue;
    }

    const buf = [];
    while (i < lines.length && lines[i].trim() && !/^\u0000B\d+\u0000$/.test(lines[i]) &&
           !/^#{1,6}\s/.test(lines[i]) && !/^\s*>/.test(lines[i]) &&
           !/^\s*[-*+]\s+/.test(lines[i]) && !/^\s*\d+[.)]\s+/.test(lines[i])) { buf.push(lines[i]); i++; }
    out.push('<p>' + inline(buf.join('\n')).replace(/\n/g, '<br>') + '</p>');
  }
  return out.join('');
}

document.addEventListener('click', e => {
  const btn = e.target.closest && e.target.closest('.copybtn');
  if (btn) copy(CodeStore[+btn.dataset.src] || '');
  const a = e.target.closest && e.target.closest('.body a');
  if (a && window.DeepSeekBridge && window.DeepSeekBridge.openUrl) {
    e.preventDefault(); window.DeepSeekBridge.openUrl(a.getAttribute('href'));
  }
});

/* ===================== 2. 设置 / 会话持久化 ===================== */
const DEF_SETTINGS = {
  apiKey: '', baseUrl: 'https://api.deepseek.com', model: 'deepseek-chat',
  temperature: 1.0, maxTokens: 4096, systemPrompt: '', stream: true, dark: true, showReason: true
};
const K_SET = 'dschat.settings.v1', K_SESS = 'dschat.sessions.v1';

const Settings = {
  data: Object.assign({}, DEF_SETTINGS),
  load() { try { Object.assign(this.data, JSON.parse(localStorage.getItem(K_SET) || '{}')); } catch (e) {} return this.data; },
  save() { try { localStorage.setItem(K_SET, JSON.stringify(this.data)); } catch (e) {} }
};
const Store = {
  sessions: [], currentId: null,
  load() {
    try {
      const raw = JSON.parse(localStorage.getItem(K_SESS) || '{}');
      this.sessions = raw.sessions || []; this.currentId = raw.currentId || null;
    } catch (e) { this.sessions = []; this.currentId = null; }
    if (!this.sessions.length) { this.newSession(); return; }
    if (!this.sessions.some(s => s.id === this.currentId)) this.currentId = this.sessions[0].id;
  },
  save() {
    try { localStorage.setItem(K_SESS, JSON.stringify({ sessions: this.sessions, currentId: this.currentId })); }
    catch (e) { toast('本地存储已满，请导出后清理'); }
  },
  newSession() {
    const s = { id: uid(), title: '新对话', model: Settings.data.model, createdAt: Date.now(), messages: [] };
    this.sessions.unshift(s); this.currentId = s.id; this.save(); return s;
  },
  cur() { return this.sessions.filter(s => s.id === this.currentId)[0]; },
  remove(id) {
    this.sessions = this.sessions.filter(s => s.id !== id);
    if (this.currentId === id) {
      if (!this.sessions.length) { this.newSession(); return; }
      this.currentId = this.sessions[0].id;
    }
    this.save();
  }
};

/* ===================== 3. API 传输层 ===================== */
function buildRequest(messages) {
  const s = Settings.data;
  const sys = (s.systemPrompt || '').trim();
  const body = {
    model: s.model,
    messages: (sys ? [{ role: 'system', content: sys }] : [])
      .concat(messages.map(m => ({ role: m.role, content: m.content }))),
    stream: !!s.stream,
    max_tokens: Math.max(256, Math.min(65536, parseInt(s.maxTokens, 10) || 4096))
  };
  if (s.model !== 'deepseek-reasoner') body.temperature = parseFloat(s.temperature);
  return body;
}

const Bridge = {
  handlers: {},
  available() { return !!(window.DeepSeekBridge && window.DeepSeekBridge.startStream); },
  stream(reqId, payload, cb) {
    this.handlers[reqId] = cb;
    window.DeepSeekBridge.startStream(reqId, Settings.data.baseUrl, Settings.data.apiKey, JSON.stringify(payload));
  },
  abort(reqId) { try { window.DeepSeekBridge.abort(reqId); } catch (e) {} },
  _fire(id, ev, a) { const h = this.handlers[id]; if (h && h[ev]) h[ev](a); },
  _end(id) { delete this.handlers[id]; }
};
window.__bridge = {
  onOpen:  function (id) { Bridge._fire(id, 'open'); },
  onDelta: function (id, t) { Bridge._fire(id, 'delta', t); },
  onReason:function (id, t) { Bridge._fire(id, 'reason', t); },
  onDone:  function (id) { Bridge._fire(id, 'done'); Bridge._end(id); },
  onError: function (id, msg) { Bridge._fire(id, 'error', msg); Bridge._end(id); }
};

async function fetchStream(payload, cb, ctrl) {
  const url = Settings.data.baseUrl.replace(/\/+$/, '') + '/chat/completions';
  let res;
  try {
    res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + Settings.data.apiKey },
      body: JSON.stringify(payload),
      signal: ctrl ? ctrl.signal : undefined
    });
  } catch (e) {
    if (e.name === 'AbortError') return;
    throw new Error('网络请求失败：' + e.message + '\n若在浏览器中打开，可能是 CORS 跨域限制，请改用 APK 版。');
  }
  if (!res.ok) {
    let detail = '';
    try { const j = await res.json(); detail = (j.error && j.error.message) || JSON.stringify(j); }
    catch (e) { try { detail = await res.text(); } catch (e2) {} }
    throw new Error('API 错误 ' + res.status + '：' + detail);
  }

  if (!payload.stream) {
    const j = await res.json();
    const m = (j.choices && j.choices[0] && j.choices[0].message) || {};
    if (m.reasoning_content && cb.reason) cb.reason(m.reasoning_content);
    if (m.content && cb.delta) cb.delta(m.content);
    if (cb.done) cb.done();
    return;
  }

  const reader = res.body.getReader();
  const dec = new TextDecoder('utf-8');
  let buf = '';
  for (;;) {
    const r = await reader.read();
    if (r.done) break;
    buf += dec.decode(r.value, { stream: true });
    const parts = buf.split('\n');
    buf = parts.pop();
    for (let n = 0; n < parts.length; n++) {
      const raw = parts[n].trim();
      if (!raw || raw.charCodeAt(0) === 58 || raw.slice(0, 5) !== 'data:') continue;
      const data = raw.slice(5).trim();
      if (data === '[DONE]') { if (cb.done) cb.done(); return; }
      let j; try { j = JSON.parse(data); } catch (e) { continue; }
      if (j.error) throw new Error('API 错误：' + (j.error.message || JSON.stringify(j.error)));
      const ch = (j.choices && j.choices[0]) || {};
      const d = ch.delta || {};
      if (d.reasoning_content && cb.reason) cb.reason(d.reasoning_content);
      if (d.content && cb.delta) cb.delta(d.content);
      if (ch.finish_reason) { if (cb.done) cb.done(); return; }
    }
  }
  if (cb.done) cb.done();
}

/* ===================== 4. 界面 ===================== */
const els = {
  main: $('#msgs'), input: $('#input'), send: $('#btnSend'), list: $('#sessList'),
  drawer: $('#drawer'), scrim: $('#scrim'), title: $('#titleText'), chip: $('#modelChip')
};
const A = { streaming: false, ctrl: null, reqId: null, bridgeReject: null };

function applyTheme() {
  document.documentElement.dataset.theme = Settings.data.dark ? 'dark' : 'light';
  const m = document.querySelector('meta[name=theme-color]');
  if (m) m.setAttribute('content', Settings.data.dark ? '#0f1115' : '#f5f6fa');
}
function scrollDown(instant) {
  requestAnimationFrame(() => els.main.scrollTo({ top: els.main.scrollHeight, behavior: instant ? 'auto' : 'smooth' }));
}
function autoGrow() {
  const t = els.input; t.style.height = 'auto';
  t.style.height = Math.min(t.scrollHeight, Math.round(window.innerHeight * 0.34)) + 'px';
}

function renderSessionList() {
  els.list.innerHTML = '';
  Store.sessions.forEach(s => {
    const d = document.createElement('div');
    d.className = 'sess' + (s.id === Store.currentId ? ' active' : '');
    const t = document.createElement('span'); t.className = 't'; t.textContent = s.title || '新对话';
    const x = document.createElement('button'); x.className = 'd'; x.title = '删除'; x.textContent = '\u2715';
    d.appendChild(t); d.appendChild(x);
    d.addEventListener('click', ev => {
      if (ev.target === x) { Store.remove(s.id); renderSessionList(); renderChat(); return; }
      Store.currentId = s.id; Store.save(); closeDrawer(); renderSessionList(); renderChat();
    });
    els.list.appendChild(d);
  });
}

function reasonEl(text, open, streaming) {
  const d = document.createElement('details');
  d.className = 'reason'; if (open) d.open = true;
  const s = document.createElement('summary');
  s.textContent = streaming ? '深度思考中…' : '深度思考过程';
  const b = document.createElement('div'); b.className = 'rbody'; b.textContent = text || '';
  d.appendChild(s); d.appendChild(b);
  d._body = b; d._sum = s;
  return d;
}

function actionBar(msg, idx) {
  const bar = document.createElement('div');
  bar.className = 'actions';
  const c = document.createElement('button'); c.textContent = '复制';
  c.onclick = () => copy(msg.content || '');
  bar.appendChild(c);
  if (msg.role === 'assistant') {
    const r = document.createElement('button'); r.textContent = '重新生成';
    r.onclick = () => regenerate(idx);
    bar.appendChild(r);
  }
  return bar;
}

function messageEl(msg, idx) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + msg.role;
  const av = document.createElement('div');
  av.className = 'avatar'; av.textContent = msg.role === 'user' ? '我' : 'DS';
  const bub = document.createElement('div'); bub.className = 'bubble';
  if (msg.role === 'assistant' && msg.reasoning && Settings.data.showReason) bub.appendChild(reasonEl(msg.reasoning, false, false));
  const body = document.createElement('div'); body.className = 'body';
  body.innerHTML = msg.role === 'user'
    ? esc(msg.content).replace(/\n/g, '<br>')
    : renderMarkdown(msg.content || '');
  bub.appendChild(body);
  if (msg.error) { const e = document.createElement('div'); e.className = 'err'; e.textContent = msg.error; bub.appendChild(e); }
  bub.appendChild(actionBar(msg, idx));
  wrap.appendChild(av); wrap.appendChild(bub);
  return wrap;
}

function emptyState() {
  const wrap = document.createElement('div');
  wrap.className = 'empty';
  wrap.innerHTML = '<div class="logo">DS</div><h2>DeepSeek 助手</h2>' +
    '<div>支持多轮对话、流式输出、深度推理与代码高亮。</div><div class="chips"></div>';
  const chips = wrap.querySelector('.chips');
  [['写一段 Python 快速排序并解释', '用 Python 写一个快速排序，并逐行解释'],
   ['解释量子纠缠', '用通俗的话解释什么是量子纠缠'],
   ['写一封请假邮件', '帮我写一封向主管请假三天的邮件'],
   ['总结相对论', '总结相对论的核心思想，分条列出']].forEach(function (p) {
    const b = document.createElement('button'); b.className = 'chip'; b.textContent = p[0];
    b.onclick = () => { els.input.value = p[1]; autoGrow(); send(); };
    chips.appendChild(b);
  });
  return wrap;
}

function renderChat() {
  const s = Store.cur(); if (!s) return;
  els.main.innerHTML = '';
  els.title.textContent = s.title || 'DeepSeek';
  els.chip.textContent = Settings.data.model;
  if (!s.messages.length) { els.main.appendChild(emptyState()); return; }
  s.messages.forEach((m, i) => els.main.appendChild(messageEl(m, i)));
  scrollDown(true);
}

function setBusy(on) {
  A.streaming = on;
  els.send.textContent = on ? '\u25A0' : '\u27A4';
  els.send.classList.toggle('stop', on);
}

/* ---------- 发送 / 流式 ---------- */
async function send() {
  if (A.streaming) { stopStream(); return; }
  const text = els.input.value.trim();
  if (!text) return;
  if (!Settings.data.apiKey) { toast('请先在设置里填写 API Key'); openSettings(); return; }
  const s = Store.cur();
  if (!s.messages.length) {
    s.title = text.slice(0, 24).replace(/\s+/g, ' ');
    Store.save(); renderSessionList();
  }
  s.messages.push({ role: 'user', content: text, ts: Date.now() });
  Store.save();
  els.input.value = ''; autoGrow();
  renderChat();
  await runCompletion();
}

async function regenerate(idx) {
  if (A.streaming) return;
  const s = Store.cur();
  if (typeof idx === 'number') s.messages.splice(idx);
  else while (s.messages.length && s.messages[s.messages.length - 1].role === 'assistant') s.messages.pop();
  Store.save(); renderChat();
  await runCompletion();
}

async function runCompletion() {
  const s = Store.cur();
  const hist = s.messages.filter(m => !m.error && m.content);
  if (!hist.length || hist[hist.length - 1].role !== 'user') return;

  const msg = { role: 'assistant', content: '', reasoning: '', ts: Date.now() };
  s.messages.push(msg);

  const wrap = document.createElement('div'); wrap.className = 'msg assistant show-actions';
  wrap.innerHTML = '<div class="avatar">DS</div><div class="bubble">' +
    '<div class="typing"><i></i><i></i><i></i></div><div class="body"></div></div>';
  const bub = wrap.querySelector('.bubble'), body = wrap.querySelector('.body');
  els.main.appendChild(wrap);
  scrollDown();

  let acc = '', rea = '', reasonBox = null, pending = false;
  const killTyping = () => { const ty = bub.querySelector('.typing'); if (ty) ty.remove(); };
  const flush = () => { pending = false; body.innerHTML = renderMarkdown(acc); scrollDown(); };
  const onDelta = t => { acc += t; if (!pending) { pending = true; requestAnimationFrame(flush); } };
  const onReason = t => {
    rea += t;
    if (!Settings.data.showReason) return;
    if (!reasonBox) { reasonBox = reasonEl('', true, true); killTyping(); bub.insertBefore(reasonBox, body); }
    reasonBox._body.textContent = rea;
    scrollDown();
  };

  setBusy(true);
  try {
    const payload = buildRequest(hist);
    if (Bridge.available()) {
      A.reqId = uid();
      await new Promise((resolve, reject) => {
        A.bridgeReject = reject;
        Bridge.stream(A.reqId, payload, {
          open: killTyping,
          delta: t => { killTyping(); onDelta(t); },
          reason: t => { killTyping(); onReason(t); },
          done: resolve,
          error: m => reject(new Error(m))
        });
      });
    } else {
      A.ctrl = new AbortController();
      await fetchStream(payload, { delta: onDelta, reason: onReason, done: () => {} }, A.ctrl);
    }
    if (reasonBox) { reasonBox._sum.textContent = '深度思考过程'; reasonBox.open = false; }
    msg.content = acc || '（无内容返回）';
    msg.reasoning = rea;
  } catch (err) {
    if (err && err.name === 'AbortError') {
      msg.content = acc || '（已停止生成）'; msg.reasoning = rea;
    } else {
      msg.error = String((err && err.message) || err);
      msg.content = acc; msg.reasoning = rea;
    }
  } finally {
    setBusy(false);
    A.ctrl = null; A.reqId = null; A.bridgeReject = null;
    if (acc) msg.content = acc;
    Store.save();
    renderChat();
  }
}

function stopStream() {
  if (A.ctrl) A.ctrl.abort();
  if (A.reqId) Bridge.abort(A.reqId);
  if (A.bridgeReject) A.bridgeReject(Object.assign(new Error('aborted'), { name: 'AbortError' }));
  setBusy(false);
}

/* ---------- 抽屉 / 设置 ---------- */
function openDrawer() { els.drawer.classList.add('open'); els.scrim.classList.add('show'); }
function closeDrawer() { els.drawer.classList.remove('open'); els.scrim.classList.remove('show'); }

function fillSettings() {
  const s = Settings.data;
  $('#fApiKey').value = s.apiKey; $('#fBaseUrl').value = s.baseUrl; $('#fModel').value = s.model;
  $('#fTemp').value = s.temperature; $('#fTempVal').textContent = parseFloat(s.temperature).toFixed(1);
  $('#fMaxTokens').value = s.maxTokens; $('#fSystem').value = s.systemPrompt || '';
  $('#fStream').checked = s.stream; $('#fDark').checked = s.dark; $('#fShowReason').checked = s.showReason;
  $('#fTemp').disabled = s.model === 'deepseek-reasoner';
  $('#envBadge').textContent = Bridge.available()
    ? '运行环境：Android 原生壳 · OkHttp 直连（不受 CORS 限制，Key 由原生层保管）'
    : '运行环境：浏览器 / WebView · 直接调用 DeepSeek API';
}
function openSettings() { fillSettings(); $('#settingsModal').classList.add('open'); }
function closeSettings() { $('#settingsModal').classList.remove('open'); }
function readSettings() {
  const s = Settings.data;
  s.apiKey = $('#fApiKey').value.trim();
  s.baseUrl = $('#fBaseUrl').value.trim() || DEF_SETTINGS.baseUrl;
  s.model = $('#fModel').value;
  s.temperature = parseFloat($('#fTemp').value) || 0;
  s.maxTokens = parseInt($('#fMaxTokens').value, 10) || 4096;
  s.systemPrompt = $('#fSystem').value;
  s.stream = $('#fStream').checked; s.dark = $('#fDark').checked; s.showReason = $('#fShowReason').checked;
}

/* ---------- 事件绑定 ---------- */
$('#btnMenu').onclick = openDrawer;
$('#scrim').onclick = closeDrawer;
$('#btnNew').onclick = () => { Store.newSession(); renderSessionList(); renderChat(); els.input.focus(); };
$('#btnSettings').onclick = () => { closeDrawer(); openSettings(); };
$('#btnCloseSettings').onclick = closeSettings;
$('#settingsModal').onclick = e => { if (e.target.id === 'settingsModal') closeSettings(); };
$('#fTemp').oninput = e => { $('#fTempVal').textContent = parseFloat(e.target.value).toFixed(1); };
$('#fModel').onchange = e => { $('#fTemp').disabled = e.target.value === 'deepseek-reasoner'; };
$('#btnSaveSettings').onclick = () => {
  readSettings(); Settings.save(); applyTheme(); closeSettings();
  toast('已保存'); renderChat(); renderSessionList();
};
$('#btnTest').onclick = async () => {
  readSettings(); Settings.save();
  const btn = $('#btnTest'); btn.disabled = true; btn.textContent = '测试中…';
  try {
    const payload = { model: Settings.data.model, messages: [{ role: 'user', content: '你好' }], stream: false, max_tokens: 16 };
    if (Settings.data.model !== 'deepseek-reasoner') payload.temperature = 0;
    let reply = '';
    if (Bridge.available()) {
      await new Promise((resolve, reject) => {
        Bridge.stream(uid(), payload, { open(){}, delta: t => reply += t, reason(){}, done: resolve, error: reject });
      });
    } else {
      const res = await fetch(Settings.data.baseUrl.replace(/\/+$/, '') + '/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + Settings.data.apiKey },
        body: JSON.stringify(payload)
      });
      const j = await res.json();
      if (!res.ok) throw new Error((j.error && j.error.message) || ('HTTP ' + res.status));
      reply = j.choices[0].message.content;
    }
    toast('连接成功 ✓ ' + String(reply).slice(0, 24));
  } catch (e) { toast('失败：' + String(e.message || e).slice(0, 90)); }
  btn.disabled = false; btn.textContent = '测试连接';
};
$('#btnExport').onclick = () => {
  const blob = new Blob([JSON.stringify({ settings: Settings.data, sessions: Store.sessions }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'deepseek-chat-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
};
$('#btnImport').onclick = () => $('#fileImport').click();
$('#fileImport').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const j = JSON.parse(r.result);
      if (j.sessions && j.sessions.length) { Store.sessions = j.sessions; Store.currentId = j.sessions[0].id; Store.save(); }
      if (j.settings) { Object.assign(Settings.data, j.settings); Settings.save(); applyTheme(); }
      renderSessionList(); renderChat(); toast('导入成功');
    } catch (err) { toast('导入失败：文件格式错误'); }
  };
  r.readAsText(f); e.target.value = '';
};
$('#btnClear').onclick = () => {
  if (!confirm('确定删除全部对话记录？此操作不可恢复。')) return;
  Store.sessions = []; Store.newSession(); Store.save();
  closeDrawer(); renderSessionList(); renderChat(); toast('已清空');
};

els.send.onclick = send;
els.input.addEventListener('input', autoGrow);
els.input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && window.innerWidth > 820) { e.preventDefault(); send(); }
});
window.addEventListener('resize', () => { autoGrow(); scrollDown(true); });
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', () => scrollDown(true));
}

/* ---------- 启动 ---------- */
Settings.load();
applyTheme();
Store.load();
renderSessionList();
renderChat();
autoGrow();
if (!Settings.data.apiKey) setTimeout(openSettings, 350);
</script>
</body>
</html>
